name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  contracts-and-tests:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-dev.txt

      - name: Install test dependencies
        run: python -m pip install -r requirements-dev.txt

      - name: Validate Compose configuration
        run: |
          docker compose -f app/compose.yaml config --quiet
          docker compose \
            --env-file app/.env.production.example \
            -f app/compose.production.yaml \
            config --quiet

      - name: Run contract and application tests
        env:
          PYTHONPATH: app/backend:app/evaluator:app/runner:app/tools
        run: >-
          python -m pytest -q
          tests
          app/backend/tests
          app/evaluator/tests
          app/runner/tests

      - name: Check shell launcher syntax
        run: |
          bash -n scripts/benchmark.sh
          bash -n scripts/defense.sh

  frontend-check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: app/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: app/frontend
        run: npm ci

      - name: Build frontend
        working-directory: app/frontend
        run: npm run build

      - name: Check frontend routes
        working-directory: app/frontend
        run: npm run test:routes

      - name: Audit frontend dependencies
        working-directory: app/frontend
        run: npm audit --audit-level=moderate

  runtime-images:
    # 브랜치 push마다 이미지를 빌드해 Dockerfile을 검증하고, main 에서만 GHCR 에 푸시한다.
    # PR 이벤트는 같은 브랜치의 push 와 중복이므로 건너뛴다.
    if: github.event_name == 'push'
    needs: [contracts-and-tests, frontend-check]
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - image: benchmark-web-postgres
            context: app/postgres
          - image: benchmark-web-redis
            context: app/redis
          - image: benchmark-web-object-store
            context: app/object-store
          - image: benchmark-web-mock-integration
            context: app/mock-integration
          - image: benchmark-web-api
            context: app/backend
          - image: benchmark-web-evaluator
            context: app/evaluator
          - image: benchmark-web-frontend
            context: app/frontend
          - image: benchmark-web-benchmark-proxy
            context: app/benchmark-proxy
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set image prefix (lowercase)
        run: echo "IMAGE_PREFIX=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        if: github.ref == 'refs/heads/main'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build${{ github.ref == 'refs/heads/main' && ' and push' || '' }} ${{ matrix.image }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: ${{ github.ref == 'refs/heads/main' }}
          tags: ${{ env.IMAGE_PREFIX }}/${{ matrix.image }}:${{ github.sha }}
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}
