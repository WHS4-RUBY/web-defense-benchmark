# 벤치마크 대상 전용 리버스 프록시.
#
# 두 벤치마크 대상을 탐지/방어 없이 직접 열 수 있는 진입점이다.
# 대상 선택과 관리 API 는 SSH 터널을 거친 loopback 포트 8088 에서만 제공한다.
#   /juice-shop/  -> juice-shop:3000  (OWASP Juice Shop, Angular SPA)
#   /ruby-shop/   -> web:8080         (RUBY Market, React/Vite SPA)
#   :8081/       -> juice-shop:3000  (원격 RUBY 설치용 루트 URL)
#   :8082/       -> web:8080         (원격 RUBY 설치용 루트 URL)
#
# Juice Shop 의 상대 리소스는 HTML 에 <base href>를 넣어 프리픽스 아래로
# 유도한다. RUBY Market 은 Vite 상대 경로 빌드와 /ruby-shop/api/ 요청을 쓴다.
# Juice Shop 의 절대 경로 요청은 루트의 기본 업스트림으로 전달한다.
#
# upstream 주소는 모두 변수로 두어 nginx 가 시작 시점이 아니라 요청 시점에
# Docker 내장 DNS 로 조회한다. 대상 컨테이너가 재시작돼 IP 가 바뀌어도
# 프록시를 재시작할 필요가 없고, 대상이 늦게 떠도 nginx 가 죽지 않는다.

server {
    listen 8080;
    server_name _;

    # 변수 proxy_pass 는 런타임 DNS 조회가 필요하다. Docker 내장 DNS 사용.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # upstream 호스트를 변수에 담아 런타임 조회를 강제한다.
    set $juice_shop "juice-shop:3000";
    set $ruby_shop  "web:8080";
    # ---- 루트: 보호 경로와 직접 접속을 구분하는 안내 화면 ----
    location = / {
        root /usr/share/nginx/html;
        try_files /index.html =404;
        add_header Cache-Control "no-store" always;
        add_header Content-Security-Policy "default-src 'none'; script-src 'self'; style-src 'self'; base-uri 'none'; form-action 'none'; frame-ancestors 'none'" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    location = /selector.css {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    location = /selector.js {
        root /usr/share/nginx/html;
        try_files $uri =404;
    }

    location = /__detection { return 404; }
    location ^~ /__detection/ {
        return 404;
    }
    location = /__defense { return 404; }
    location ^~ /__defense/ { return 404; }

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # ======================================================================
    #  Juice Shop  (/juice-shop/)
    # ======================================================================
    # 프리픽스를 떼고 백엔드로 전달하되, 응답 HTML 에 <base> 를 넣어
    # 상대 경로 리소스가 프리픽스 아래로 요청되게 한다.
    location = /juice-shop {
        return 301 /juice-shop/;
    }

    location /juice-shop/ {
        # 변수 proxy_pass 는 URI 를 자동으로 붙이지 않으므로 rewrite 로
        # 프리픽스를 떼고 남은 경로를 넘긴다.
        rewrite ^/juice-shop/(.*)$ /$1 break;
        proxy_pass http://$juice_shop;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /juice-shop;
        # location 의 proxy_set_header 는 상위 설정을 상속하지 않는다.
        # 압축된 HTML 에는 sub_filter 를 적용할 수 없으므로 여기서 끈다.
        proxy_set_header Accept-Encoding "";
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Juice Shop 원본 index.html 은 <base> 가 없어 <head> 바로 뒤에 넣는다.
        sub_filter '<head>' '<head><base href="/juice-shop/">';
    }

    # ======================================================================
    #  RUBY Market  (/ruby-shop/)
    # ======================================================================
    location = /ruby-shop {
        return 301 /ruby-shop/;
    }

    location /ruby-shop/ {
        rewrite ^/ruby-shop/(.*)$ /$1 break;
        proxy_pass http://$ruby_shop;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /ruby-shop;
    }

    # ======================================================================
    #  Juice Shop 의 하드코딩 절대 경로 폴백
    # ======================================================================
    # Juice Shop 의 socket.io / rest 는 항상 Juice Shop 으로 보낸다.
    location /socket.io/ {
        proxy_pass http://$juice_shop;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /rest/ {
        proxy_pass http://$juice_shop;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # RUBY Market 은 항상 /ruby-shop/api/ 로 요청하므로 출처 추론이 필요 없다.
    # Juice Shop 의 다른 절대 경로(/api, /assets, /ftp 등)도 이 경로로 처리한다.
    location / {
        proxy_pass http://$juice_shop;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

# RUBY를 다른 컴퓨터에 설치할 때 경로 프리픽스 없는 URL을 등록해야 한다.
# 위 3020 프리픽스 URL을 그대로 Defense의 target URL로 사용하면 SPA의
# 절대/상대 리소스 및 API 경로가 이중으로 붙는다.
server {
    listen 8081;
    server_name _;
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $juice_shop "juice-shop:3000";

    location / {
        proxy_pass http://$juice_shop;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}

server {
    listen 8082;
    server_name _;
    resolver 127.0.0.11 valid=30s ipv6=off;
    set $ruby_shop "web:8080";

    location / {
        proxy_pass http://$ruby_shop;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
