# 벤치마크 대상 전용 리버스 프록시.
#
# 탐지(Detection)/방어(Defense) 파이프라인과 분리된 독립 진입점이다.
# 두 벤치마크 대상을 하나의 포트에서 경로로 구분해 노출한다.
#   /juice-shop/  -> juice-shop:3000  (OWASP Juice Shop, Angular SPA)
#   /ruby-shop/   -> web:8080         (RUBY Market, React/Vite SPA)
#
# 두 앱 모두 절대 경로(/assets, /api, ...)로 리소스를 참조하는 SPA 라서
# 하위 경로(subpath)에서 그대로 돌리려면 <base href>를 주입해 브라우저가
# 각 리소스를 자기 프리픽스 아래에서 요청하도록 유도한다. base href 를
# 무시하고 하드코딩된 절대 경로로만 호출하는 소수의 엔드포인트는 Referer
# 기반으로 올바른 백엔드에 연결한다.
#
# upstream 주소는 모두 변수로 두어 nginx 가 시작 시점이 아니라 요청 시점에
# Docker 내장 DNS 로 조회한다. 대상 컨테이너가 재시작돼 IP 가 바뀌어도
# 프록시를 재시작할 필요가 없고, 대상이 늦게 떠도 nginx 가 죽지 않는다.

# 호출 출처(Referer)로 /api 등 공용 절대 경로의 백엔드를 고른다.
map $http_referer $api_upstream {
    default          "juice-shop:3000";
    "~*/ruby-shop/"  "web:8080";
    "~*/juice-shop/" "juice-shop:3000";
}

server {
    listen 8080;
    server_name _;

    # 변수 proxy_pass 는 런타임 DNS 조회가 필요하다. Docker 내장 DNS 사용.
    resolver 127.0.0.11 valid=30s ipv6=off;

    # upstream 호스트를 변수에 담아 런타임 조회를 강제한다.
    set $juice_shop "juice-shop:3000";
    set $ruby_shop  "web:8080";

    # 프록시가 sub_filter 로 응답 본문을 고쳐 쓰므로 업스트림 압축을 끈다.
    proxy_set_header Accept-Encoding "";

    # ---- 루트: 대상 선택 안내 페이지 ----
    location = / {
        default_type text/html;
        return 200 '<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Benchmark Targets</title><style>body{font-family:system-ui,sans-serif;max-width:40rem;margin:4rem auto;padding:0 1.5rem;color:#1a1a1a}h1{font-size:1.4rem}a{display:block;padding:1rem 1.25rem;margin:.75rem 0;border:1px solid #d0d0d0;border-radius:.5rem;text-decoration:none;color:#1a1a1a}a:hover{border-color:#888;background:#fafafa}</style></head><body><h1>Web Defense Benchmark Targets</h1><p>벤치마크 대상 두 가지를 경로로 선택합니다.</p><a href="/juice-shop/">/juice-shop/ &rarr; OWASP Juice Shop</a><a href="/ruby-shop/">/ruby-shop/ &rarr; RUBY Market</a></body></html>';
    }

    location = /healthz {
        default_type text/plain;
        return 200 "ok\n";
    }

    # ======================================================================
    #  Juice Shop  (/juice-shop/)
    # ======================================================================
    # 프리픽스를 떼고 백엔드로 전달하되, 응답 HTML 의 <base href="/"> 를
    # /juice-shop/ 로 바꿔 상대 경로 리소스가 프리픽스 아래로 요청되게 한다.
    location = /juice-shop {
        return 301 /juice-shop/;
    }

    location /juice-shop/ {
        # 변수 proxy_pass 는 URI 를 자동으로 붙이지 않으므로 rewrite 로
        # 프리픽스를 떼고 남은 경로를 넘긴다.
        rewrite ^/juice-shop/(.*)$ /$1 break;
        proxy_pass http://$juice_shop;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /juice-shop;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";

        # Angular 의 <base href> 주입으로 상대 경로 리소스를 프리픽스로 유도.
        sub_filter_once off;
        sub_filter_types text/html application/javascript;
        sub_filter '<base href="/">' '<base href="/juice-shop/">';
    }

    # ======================================================================
    #  RUBY Market  (/ruby-shop/)
    # ======================================================================
    location = /ruby-shop {
        return 301 /ruby-shop/;
    }

    location /ruby-shop/ {
        rewrite ^/ruby-shop/(.*)$ /$1 break;
        proxy_pass http://$ruby_shop;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Prefix /ruby-shop;

        # Vite 빌드는 <base> 가 없으므로 <head> 바로 뒤에 주입한다.
        sub_filter_once off;
        sub_filter_types text/html application/javascript application/json;
        sub_filter '<head>' '<head><base href="/ruby-shop/">';
    }

    # ======================================================================
    #  base href 를 무시하는 하드코딩 절대 경로 폴백
    # ======================================================================
    # Juice Shop 의 socket.io / rest 는 항상 Juice Shop 으로 보낸다.
    location /socket.io/ {
        proxy_pass http://$juice_shop;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location /rest/ {
        proxy_pass http://$juice_shop;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # /api/ 는 두 앱이 모두 쓰므로 Referer 로 백엔드를 고른다.
    location /api/ {
        proxy_pass http://$api_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
